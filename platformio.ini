; platformio.ini

[platformio]
default_envs = mkr1010_release

[common]
lib_deps =
    arduino-libraries/WiFiNINA@^1.8.14
    arduino-libraries/Arduino Low Power@^1.2.2
    arduino-libraries/RTCZero@^1.6.0
    arduino-libraries/ArduinoHttpClient@^0.4.0
    bblanchon/ArduinoJson@^7.0.4

; Source code must stay C++11-compatible: the Arduino framework forces
; -std=gnu++11 and later flags override ours, so we do not fight it.
build_flags =
    -Wall
    -Wextra
    -Isrc
    -DPROJECT_VERSION='"1.0.0"'

; Debug environment (WiFi only)
[env:mkr1010_debug]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps = ${common.lib_deps}

build_flags =
    ${common.build_flags}
    -DDEBUG=1
    -DLOG_LEVEL=5        ; Verbose logging
    -DETHERNET_ENABLED=0
    -O0                  ; No optimization for debugging

monitor_speed = 115200
monitor_filters =
    colorize
    time

; Release environment (WiFi only)
[env:mkr1010_release]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps = ${common.lib_deps}

build_flags =
    ${common.build_flags}
    -DDEBUG=0
    -DLOG_LEVEL=2        ; Errors and warnings only
    -DETHERNET_ENABLED=0
    -Os                  ; Optimize for size
    -DNDEBUG

; Ethernet-enabled environment (MKR ETH shield on SPI)
[env:mkr1010_ethernet]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps =
    ${common.lib_deps}
    arduino-libraries/Ethernet@^2.0.2

build_flags =
    ${common.build_flags}
    -DDEBUG=1
    -DLOG_LEVEL=4
    -DETHERNET_ENABLED=1
    -O0

; OTA-enabled environment (for remote updates)
[env:mkr1010_ota]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps =
    ${common.lib_deps}
    jandrassy/ArduinoOTA@^1.1.1

build_flags =
    ${common.build_flags}
    -DDEBUG=0
    -DLOG_LEVEL=3
    -DETHERNET_ENABLED=0
    -DOTA_ENABLED=1
    -Os

; SolarEdge-brand firmware (cloud Monitoring API v2 over HTTPS)
[env:mkr1010_solaredge]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps = ${common.lib_deps}

build_flags =
    ${common.build_flags}
    -DINVERTER_BRAND=INVERTER_BRAND_SOLAREDGE
    -DDEBUG=0
    -DLOG_LEVEL=2
    -DETHERNET_ENABLED=0
    -Os
    -DNDEBUG

; Native unit-test environment (host, no hardware)
[env:native_test]
platform = native

build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Isrc
    -Itest/arduino_stubs
    -DDEBUG=1
    -DETHERNET_ENABLED=0

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    arduino-libraries/ArduinoHttpClient@^0.4.0

; The HttpClient library declares framework=arduino; we use it on the host
; against Arduino stubs, so disable compatibility filtering.
lib_compat_mode = off

test_build_src = yes
build_src_filter =
    +<*>
    -<main.cpp>
    -<hal/implementations/wifi_network.cpp>
    -<hal/implementations/ethernet_network.cpp>
