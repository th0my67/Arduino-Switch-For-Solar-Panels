; PlatformIO project: one environment per hardware target, plus a native
; environment that runs the unit tests for the hardware-independent logic
; on the host machine.

[platformio]
src_dir = SolarSwitch
default_envs = mkrzero_eth

; MKR Zero + MKR ETH Shield (W5500, wired)
[env:mkrzero_eth]
platform = atmelsam
board = mkrzero
framework = arduino
build_flags = -DSOLAR_PLATFORM_MKR_ETH=1
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    arduino-libraries/ArduinoLowPower@^1.2.2

; MKR WiFi 1010 (WiFiNINA, TLS available) + Fronius
[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino
build_flags = -DSOLAR_PLATFORM_MKR_WIFI=1
lib_deps =
    arduino-libraries/WiFiNINA@^1.8.14
    arduino-libraries/ArduinoLowPower@^1.2.2

; MKR WiFi 1010 + SolarEdge cloud API (needs API keys in Secrets.h)
[env:mkrwifi1010_solaredge]
platform = atmelsam
board = mkrwifi1010
framework = arduino
build_flags = -DSOLAR_PLATFORM_MKR_WIFI=1 -DSOLAR_INVERTER_SOLAREDGE=1
lib_deps =
    arduino-libraries/WiFiNINA@^1.8.14
    arduino-libraries/ArduinoLowPower@^1.2.2

; Host-side unit tests: `pio test -e native`
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<src/core/> +<src/services/>
build_flags = -std=gnu++11 -I SolarSwitch
