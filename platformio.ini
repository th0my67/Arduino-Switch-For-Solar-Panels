; platformio.ini - Complete configuration with all recommended libraries

[platformio]
default_envs = mkr1010_debug

[common]
lib_deps = 
    ; Essential libraries
    arduino-libraries/WiFiNINA@^1.8.14
    arduino-libraries/Arduino Low Power@^1.2.2
    arduino-libraries/ArduinoHttpClient@^0.4.0
    bblanchon/ArduinoJson@^7.0.4
    
    ; Time management
    paulstoffregen/Time@^1.6.1
    arduino-libraries/NTPClient@^3.2.1
    
    ; Utilities
    thijse/ArduinoLog@^1.1.1

build_flags = 
    -std=c++17
    -Wall
    -Wextra
    -DPROJECT_VERSION='"1.0.0"'

; Debug environment (WiFi only)
[env:mkr1010_debug]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps = ${common.lib_deps}

build_flags = 
    ${common.build_flags}
    -DDEBUG=1
    -DLOG_LEVEL=5        ; Verbose logging
    -DETHERNET_ENABLED=0
    -O0                  ; No optimization for debugging

monitor_speed = 115200
monitor_filters = 
    colorize
    time

; Release environment (WiFi only)
[env:mkr1010_release]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps = ${common.lib_deps}

build_flags = 
    ${common.build_flags}
    -DDEBUG=0
    -DLOG_LEVEL=2        ; Errors and warnings only
    -DETHERNET_ENABLED=0
    -Os                  ; Optimize for size
    -DNDEBUG

; Ethernet-enabled environment
[env:mkr1010_ethernet]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps = 
    ${common.lib_deps}
    arduino-libraries/Ethernet@^2.0.2

build_flags = 
    ${common.build_flags}
    -DDEBUG=1
    -DLOG_LEVEL=4
    -DETHERNET_ENABLED=1
    -O0

; OTA-enabled environment (for remote updates)
[env:mkr1010_ota]
platform = atmelsam
board = mkrwifi1010
framework = arduino

lib_deps = 
    ${common.lib_deps}
    arduino-libraries/ArduinoOTA@^1.0.12

build_flags = 
    ${common.build_flags}
    -DDEBUG=0
    -DLOG_LEVEL=3
    -DETHERNET_ENABLED=0
    -DOTA_ENABLED=1
    -Os